plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.cube.agent'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.cube.agent'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // The whole app (cube engine, teacher, model, UI) lives in ../web and is served from assets.
    sourceSets {
        main.assets.srcDirs = ['../../web']
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
