plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.cube.agent'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.cube.agent'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The whole app (cube engine, teacher, model, UI) lives in ../web and is served from assets.
    sourceSets {
        main.assets.srcDirs = ['../../web']
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
